<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Meshly encrypted storage flow</title><desc id="d">A logical file is encrypted, routed by provider policy, and verified in one compatible destination.</desc><style>text{font-family:Inter,Arial,sans-serif;fill:#202124}.s{font-size:14px;fill:#5f6368}.h{font-size:20px;font-weight:700}.b{fill:white;stroke:#dfe4ea;stroke-width:2}.a{stroke:#9aa0a6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9aa0a6"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f8f7ff"/></linearGradient></defs><rect width="1200" height="400" rx="30" fill="url(#g)"/><rect class="b" x="48" y="125" rx="22" width="190" height="130"/><text class="h" x="143" y="173" text-anchor="middle">Logical file</text><text class="s" x="143" y="205" text-anchor="middle">project.zip · 4 GB</text><text class="s" x="143" y="230" text-anchor="middle">user-facing name</text><path class="a" d="M238 190h70"/><rect class="b" x="308" y="100" rx="22" width="220" height="180"/><circle cx="350" cy="145" r="16" fill="#4285F4" opacity=".16"/><text class="h" x="383" y="151">Encrypt v1</text><text class="s" x="418" y="190" text-anchor="middle">AES-256-GCM frames</text><text class="s" x="418" y="216" text-anchor="middle">fresh per-file key</text><text class="s" x="418" y="242" text-anchor="middle">plaintext + ciphertext hashes</text><path class="a" d="M528 190h70"/><rect class="b" x="598" y="100" rx="22" width="230" height="180"/><text class="h" x="713" y="147" text-anchor="middle">Provider policy</text><text class="s" x="713" y="185" text-anchor="middle">health + capacity</text><text class="s" x="713" y="211" text-anchor="middle">Auto or manual choice</text><text class="s" x="713" y="237" text-anchor="middle">capability-aware transfer</text><path class="a" d="M828 155h75"/><path class="a" d="M828 230h75"/><rect class="b" x="903" y="82" rx="22" width="250" height="120"/><circle cx="942" cy="142" r="15" fill="#34A853"/><text class="h" x="975" y="130">Google Drives</text><text class="s" x="975" y="156">one managed file → one account</text><text class="s" x="975" y="179">opaque ciphertext object · verified</text><rect class="b" x="903" y="222" rx="22" width="250" height="110"/><circle cx="942" cy="277" r="15" fill="#B58CFF"/><text class="h" x="975" y="268">Other Clouds</text><text class="s" x="975" y="294">provider adapter + declared capabilities</text></svg>
